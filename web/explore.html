<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design-It! 3-D explorer</title>
<style>
  :root{--ink:#e9f0f8;--dim:#93a5ba;--panel:rgba(16,22,29,.9);--line:#2a3543;--accent:#5aa9e6}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#0e1319;color:var(--ink);
    font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  canvas{display:block}
  .card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;backdrop-filter:blur(6px)}
  #modes{left:14px;top:14px;display:flex;gap:6px;align-items:center}
  #modes button{background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:5px;padding:5px 11px;font:inherit;cursor:pointer}
  #modes button[aria-pressed=true]{background:#2d5f85;border-color:var(--accent);color:#fff}
  #modes .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
  #pickedRow{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px}
  #picked{color:#ffd479;font-weight:600}
  #hud{right:14px;top:14px;min-width:210px}
  #hud b{color:var(--accent);font-weight:600}
  #hud div{color:var(--dim);font-size:11.5px}
  #help{left:14px;bottom:14px;color:var(--dim);font-size:11.5px;line-height:1.7}
  #help kbd{background:#0c1117;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
    padding:1px 5px;color:var(--ink);font:11px ui-monospace,monospace}
  #here{left:50%;transform:translateX(-50%);bottom:16px;padding:6px 14px;font-size:12.5px;
    opacity:0;transition:opacity .18s}
  #here.on{opacity:1}
  #splash{position:absolute;inset:0;display:grid;place-items:center;background:#0e1319;z-index:9;
    text-align:center}
  #splash .inner{max-width:440px}
  #splash h1{margin:0 0 6px;font-size:19px}
  #splash p{margin:0 0 16px;color:var(--dim)}
  #bar{height:5px;background:#1b2530;border-radius:3px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
  #splash small{display:block;margin-top:9px;color:var(--dim);font-size:11.5px;min-height:1.4em}
  #crosshair{position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;
    background:#fff;border-radius:50%;opacity:.55;pointer-events:none}
</style>
</head>
<body>
<div id="modes" class="card">
  <button id="mGallery" aria-pressed="true">Gallery grid</button>
  <button id="mScenes" aria-pressed="false">Scenes</button>
  <button id="mModels" aria-pressed="false">Models</button>
  <span class="sep"></span>
  <button id="mWire" aria-pressed="false" title="L">Edges</button>
  <button id="mTex" aria-pressed="true" title="T">Textures</button>
</div>
<div id="hud" class="card">
  <b id="modeName">Gallery grid</b>
  <div id="counts"></div>
  <div id="pos"></div>
  <div id="mv"></div>
  <div id="pickedRow"><span id="pickedLabel">picked</span> <b id="picked">—</b></div>
</div>
<div id="help" class="card">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp; mouse look &nbsp; <kbd>Shift</kbd> sprint<br>
  <kbd>Space</kbd> up / jump &nbsp; <kbd>C</kbd> down &nbsp; <kbd>Tab</kbd> fly ↔ walk &nbsp; <kbd>Esc</kbd> release<br>
  <kbd>L</kbd> edge overlay &nbsp; <kbd>T</kbd> textures &nbsp; click to pin the object under the crosshair
</div>
<div id="here" class="card"></div>
<div id="crosshair"></div>
<div id="splash"><div class="inner">
  <h1>Design-It! 3-D explorer</h1>
  <p>Building the world from the original 1993 files&hellip;</p>
  <div id="bar"><i></i></div>
  <small id="progress"></small>
</div></div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { parse, wlbItems } from './src/iff.js';
import { sceneMeshes, collect, options } from './src/geometry.js';
import { buildGroup } from './src/three-loader.js';
import { shelfPack } from './src/pack.js';
import { Explorer } from './src/controls.js';

THREE.Object3D.DEFAULT_UP.set(0, 0, 1);
options.applySlic = true; options.slicKeepNeg = false; options.drawSurf = true;

const DATA = '../data/';
const $ = (id) => document.getElementById(id);
const url = (p) => DATA + p.split('/').map(encodeURIComponent).join('/');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb8dc);
scene.fog = new THREE.Fog(0x8fb8dc, 4000, 42000);
const camera = new THREE.PerspectiveCamera(70, 1, 1, 60000);

// The APPLICATION's own light model, read off its VRML exporter: every one of
// the 3,184 materials in the Virtus exports writes `ambientColor` at exactly
// 0.25 x `diffuseColor`, so a face is `albedo * (0.25 + 0.75 * lambert)` and
// nothing else -- no hemisphere tint, no warm key, no fill. A stylised rig made
// white read blue on top and warm on the side, which is what showed up as our
// colours being slightly off against the application's palette.
//
// Colour management is off for the same reason. Three.js lights in LINEAR space
// by default, so a 50%-lit mid-tone comes out darker than the same multiply
// done on the stored bytes -- which is what a 1993 8-bit renderer did, and what
// the Python reference in claude-explore/tools/render.py does.
THREE.ColorManagement.enabled = false;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
//
// The diffuse term is |n . L|, not max(0, n . L): the application lit a face by
// how square-on it was and did not care which way it pointed, and so does the
// Python reference. Three.js clamps at zero, so the same lamp is hung twice,
// facing each other -- max(0, n.L) + max(0, -n.L) is exactly |n . L| -- rather
// than leaving every surface turned away from the sun flat at ambient.
// Intensities carry a factor of PI: since r155 three.js lights in physical
// units, where a directional lamp of intensity 1 lands as 1/PI of the albedo.
// 0.25 and 0.75 are the numbers that matter; PI is the unit conversion.
scene.add(new THREE.AmbientLight(0xffffff, 0.25 * Math.PI));
const sun = new THREE.DirectionalLight(0xffffff, 0.75 * Math.PI);
sun.position.set(0.45, 0.35, 0.82);
scene.add(sun);
const sunBack = new THREE.DirectionalLight(0xffffff, 0.75 * Math.PI);
sunBack.position.set(-0.45, -0.35, -0.82);
scene.add(sunBack);

const explorer = new Explorer(camera, renderer.domElement);
explorer.onModeChange = (walk) => { $('mv').textContent = walk ? 'walking' : 'flying'; };
$('mv').textContent = 'flying';

let world = null;          // { group, ground, items: [{name,x,y,group,size}] }
let wireOn = false, texOn = true;
let pinned = null;
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ---- building ----

// Drop the decorative ground pads.
//
// Most scenes and models sit on one enormous slab -- 8040 inches across and 24
// thick is the stock one, APOLLO's is 34,000 -- which is not part of the
// subject but dominates the packing, so every object ends up hundreds of feet
// from its neighbour with nothing in between.
//
// The rule is relative, not a magic size, and it is anchored on the MEDIAN
// solid footprint: a pad is outsized relative to the CONTENT, so only solids
// bigger than CULL_FACTOR x median (and over CULL_FLOOR inches) are even
// candidates. Within that candidate set, cut at the LARGEST ratio gap.
//
// Two earlier rules were wrong in opposite directions:
//   * Walking down and stopping at the first pair whose ratio was under
//     CULL_FACTOR missed GRADUATED stacks. `CAMPUS_E` carries pads at 360,000 /
//     360,000 / 188,760 / 182,160 / 177,240 inches before an 18.7x cliff down
//     to its real content at 9,480 -- adjacent ratios of 1.91, 1.04, 1.03, so
//     the walk stopped immediately and the scene stayed 5.7 MILES wide and was
//     skipped entirely.
//   * Taking the largest gap ANYWHERE fixed that and broke `Window.wsb`, whose
//     solids run 1,596 down to 1,127 with no pad at all: the biggest ratio sat
//     deep in the tail and it happily deleted twelve real objects. The median
//     anchor is what stops that -- nothing in that file is 3x the median, so
//     there are no candidates and nothing is dropped.
//
// CULL_GAP is deliberately HIGH. At 3x it deleted the Monopoly BOARD: a board
// game's board is a big flat slab with small pieces sitting on it, which is
// indistinguishable from a ground pad by footprint alone. `monoply.wsb` runs
// 8,846 (tabletop) / 4,392 / 4,392 (the board, in two halves) / 1,359 (table
// legs), and the biggest ratio in that ladder is only 3.23 -- so a 3x threshold
// cut three real objects and left the money and houses floating. A genuine pad
// stands much further clear: CAMPUS_E's is 18.7x, meiji's 7.5x. Requiring 4x
// keeps both of those working and declines to guess on ladders like Monopoly's
// or the Great Pyramid's, where the gaps are shallow and ambiguous.
//
// The bias is intentional: when the ladder is unclear, KEEP the geometry. A pad
// left in makes one object too big; a wrong cut silently deletes the subject.
//
// Tie groups need no special case under this rule: pads come in matched sets
// (APOLLO and SHUTTLE carry two or three identical slabs), and a cut inside a
// tie has ratio 1.0, which can never be the largest gap.
//
// Cosmetic, and for the explorer only: nothing here touches the loader or the
// geometry the parity harness measures.
const CULL_FACTOR = 3, CULL_FLOOR = 1000, CULL_GAP = 4;

function cullOversized(meshes) {
  const solid = [], foot = [];
  meshes.forEach((m, i) => {
    if (m.isFeature || !m.verts.length) return;
    let lox = Infinity, loy = Infinity, hix = -Infinity, hiy = -Infinity;
    for (const v of m.verts) {
      if (v[0] < lox) lox = v[0]; if (v[0] > hix) hix = v[0];
      if (v[1] < loy) loy = v[1]; if (v[1] > hiy) hiy = v[1];
    }
    solid.push(i); foot.push(Math.max(hix - lox, hiy - loy));
  });
  if (solid.length < 2) return { meshes, culled: 0 };
  const order = solid.map((i, k) => k).sort((a, b) => foot[b] - foot[a]);
  const desc = order.map((k) => foot[k]);
  const median = desc[desc.length >> 1] || 1;
  const limit = Math.max(CULL_FLOOR, CULL_FACTOR * median);
  let n = 0;
  while (n < desc.length && desc[n] > limit) n++;     // how many are pad-sized at all
  const drop = new Set();
  if (n && n < desc.length) {
    let cut = 0, bestRatio = 0;
    for (let k = 1; k <= n; k++) {
      const r = desc[k - 1] / desc[k];
      if (r > bestRatio && r >= CULL_GAP) { bestRatio = r; cut = k; }
    }
    for (let t = 0; t < cut; t++) drop.add(solid[order[t]]);
  }
  if (!drop.size) return { meshes, culled: 0 };
  // a decoration painted on a pad goes with it
  const kept = meshes.filter((m, i) => !drop.has(i) && !(m.isFeature && bigFeature(m)));
  return { meshes: kept, culled: drop.size };
}
function bigFeature(m) {
  let lox = Infinity, loy = Infinity, hix = -Infinity, hiy = -Infinity;
  for (const v of m.verts) {
    if (v[0] < lox) lox = v[0]; if (v[0] > hix) hix = v[0];
    if (v[1] < loy) loy = v[1]; if (v[1] > hiy) hiy = v[1];
  }
  return Math.max(hix - lox, hiy - loy) > CULL_FLOOR;
}

// The explorer used to keep its OWN copy of this, and it silently rotted:
// textures, translucent solids and the coplanar depth fix all landed in
// three-loader.js and none of them reached the fly-through. One builder now.
function meshesToGroup(meshes) {
  const { group, triangles } = buildGroup(meshes, { flatShading: true });
  return { group, triangles };
}

const bufCache = new Map();
async function fetchBuf(p) {
  if (!bufCache.has(p)) bufCache.set(p, fetch(url(p)).then((r) => r.arrayBuffer()));
  return bufCache.get(p);
}
const sleep = () => new Promise((r) => setTimeout(r, 0));
function progress(frac, text) {
  $('bar').firstElementChild.style.width = `${Math.round(frac * 100)}%`;
  $('progress').textContent = text;
}

async function buildGallery(manifest) {
  const files = manifest.files.filter((f) => f.bucket === 'galleries3d' && !f.path.split('/').pop().startsWith('ID'));
  const raw = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    progress(i / files.length * 0.85, `Reading ${f.path.split('/').pop()} — ${raw.length} objects`);
    await sleep();
    try {
      const root = parse(await fetchBuf(f.path));
      for (const { name, chunk } of wlbItems(root)) {
        const meshes = collect(chunk, []);
        if (!meshes.length) continue;
        const built = meshesToGroup(meshes);
        const box = new THREE.Box3().setFromObject(built.group);
        const s = box.getSize(new THREE.Vector3());
        if (!isFinite(s.x) || s.x > 4000 || s.y > 4000) continue;   // stray oversize clips
        raw.push({ name, built, box, size: [s.x, s.y, s.z] });
      }
    } catch (e) { /* skip unreadable gallery */ }
  }
  progress(0.9, `Packing ${raw.length} objects…`);
  await sleep();
  const { placed, extent } = shelfPack(raw, { gap: 30, aisle: 70 });
  const group = new THREE.Group();
  const items = [];
  for (const p of placed) {
    const it = p.ref;
    const c = it.box.getCenter(new THREE.Vector3());
    // centre on the cell and sit the bounding box ON the ground
    it.built.group.position.set(p.x - c.x - extent[0] / 2, p.y - c.y - extent[1] / 2, -it.box.min.z);
    it.built.group.userData.itemName = it.name;
    group.add(it.built.group);
    items.push({ name: it.name, x: p.x - extent[0] / 2, y: p.y - extent[1] / 2, group: it.built.group, size: it.size });
  }
  const ground = makeGround(Math.max(extent[0], extent[1]) * 3.2, 0x6f7d5a);
  group.add(ground);
  return { group, ground, items, extent, label: 'Gallery grid' };
}

// One builder for both whole-file buckets: `scenes` (rooms and sites) and
// `models` (single subjects). They differ only in label, spacing and how big a
// leftover is worth keeping, so they share the code.
async function buildFileBucket(manifest, cfg) {
  const files = manifest.files.filter((f) => f.bucket === cfg.bucket && f.bounds);
  const raw = [];
  let culled = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    progress(i / files.length * 0.85, `Reading ${f.path.split('/').pop()} — ${raw.length} ${cfg.noun}`);
    await sleep();
    try {
      const cut = cullOversized(sceneMeshes(parse(await fetchBuf(f.path))));
      culled += cut.culled;
      if (!cut.meshes.length) continue;
      const built = meshesToGroup(cut.meshes);
      const box = new THREE.Box3().setFromObject(built.group);
      const s = box.getSize(new THREE.Vector3());
      if (!isFinite(s.x) || Math.max(s.x, s.y) > cfg.maxSpan) continue;   // still runaway
      raw.push({ name: f.path.split('/').pop().replace(/\.(VVR|WSB)$/i, ''), built, box, size: [s.x, s.y, s.z] });
    } catch (e) { /* skip */ }
  }
  progress(0.9, `Packing ${raw.length} ${cfg.noun}…`);
  await sleep();
  const { placed, extent } = shelfPack(raw, { gap: cfg.gap, aisle: cfg.aisle });
  const group = new THREE.Group();
  const items = [];
  for (const p of placed) {
    const it = p.ref;
    const c = it.box.getCenter(new THREE.Vector3());
    it.built.group.position.set(p.x - c.x - extent[0] / 2, p.y - c.y - extent[1] / 2, -it.box.min.z);
    it.built.group.userData.itemName = it.name;
    group.add(it.built.group);
    items.push({ name: it.name, x: p.x - extent[0] / 2, y: p.y - extent[1] / 2, group: it.built.group, size: it.size });
  }
  const ground = makeGround(Math.max(extent[0], extent[1]) * 2.6, cfg.groundColor);
  group.add(ground);
  return { group, ground, items, extent, label: cfg.label, culled };
}

// maxSpan is the last-resort gate for geometry the cull could not tame. It was
// 14,000 in, which quietly excluded twenty legitimate subjects once the corpus
// tripled -- the Great Pyramid, Chichen Itza, a ziggurat, the White House,
// Himeji Castle. With the cull anchored on the median, the largest thing that
// survives anywhere in the corpus is 27,072 in, so 30,000 admits everything
// real and still catches a runaway.
const buildScenes = (m) => buildFileBucket(m, {
  bucket: 'scenes', label: 'Scenes', noun: 'scenes',
  gap: 160, aisle: 320, maxSpan: 30000, groundColor: 0x5d6b4c });

const buildModels = (m) => buildFileBucket(m, {
  bucket: 'models', label: 'Models', noun: 'models',
  gap: 90, aisle: 200, maxSpan: 30000, groundColor: 0x66705f });

// The ground is OURS, not the file's -- the corpus has no world floor, every
// object simply sits at z = 0. So a scene's own slab, patio or ground pad is
// exactly coplanar with it and the two z-fight across the whole view.
//
// Two things, because either alone leaves cases: drop the plane a hair, and
// give it a positive polygonOffset so it is pushed AWAY from the camera in
// depth and can never win a tie. Losing every contest is the correct behaviour
// for a backdrop, and the offset is in depth units only -- the plane does not
// move, so walk mode still lands the player on z = 0.
//
// This does not touch the z-fighting BETWEEN objects in a scene: those are
// coplanar in the original data, which was drawn by a painter's algorithm with
// no depth buffer at all. That is a separate problem and needs a plan.
const GROUND_DROP = 0.05;      // inches

function makeGround(size, color) {
  const mat = new THREE.MeshLambertMaterial({ color });
  mat.polygonOffset = true;
  mat.polygonOffsetFactor = 4;
  mat.polygonOffsetUnits = 8;
  const g = new THREE.Mesh(new THREE.PlaneGeometry(size, size), mat);
  g.position.z = -GROUND_DROP;
  g.userData.isGround = true;
  return g;
}

// Raycasting against every mesh in the world each frame is far too slow, so
// walk mode only tests the objects whose cell is near the player.
function nearbyPicker(w) {
  return (pos) => {
    const out = [w.ground];
    for (const it of w.items) {
      if (Math.abs(it.x - pos.x) < 260 && Math.abs(it.y - pos.y) < 260) {
        it.group.traverse((o) => { if (o.isMesh && !o.userData.isFeature) out.push(o); });
      }
    }
    return out;
  };
}

async function setMode(which) {
  $('splash').style.display = 'grid';
  progress(0, 'Loading manifest…');
  const manifest = await (await fetch(DATA + 'manifest.json')).json();
  if (world) { scene.remove(world.group); }
  world = which === 'scenes' ? await buildScenes(manifest)
        : which === 'models' ? await buildModels(manifest)
        : await buildGallery(manifest);
  scene.add(world.group);
  explorer.pickNearby = nearbyPicker(world);
  // spawn back and above the grid so the first view is an overview, not the
  // inside of whatever ended up in the front row
  // Spawn just outside the FIRST object rather than outside the whole world:
  // the scene grid is tens of thousands of inches across, and framing all of
  // it puts everything below the horizon.
  // Stand off by the MEDIAN item size. Neither the world span nor the first
  // item's own box works: the world is tens of thousands of inches wide, and
  // individual scenes carry decorative ground pads an order of magnitude
  // larger than the building on them. The median shrugs those outliers off.
  const span = Math.max(world.extent[0], world.extent[1]);
  // ...and land beside a median-SIZED item too. Items are packed largest
  // first, so spawning at the front of the grid drops the camera inside a
  // whole-room clip.
  const diag = world.items.map((i) => Math.hypot(i.size[0], i.size[1]));
  const med = [...diag].sort((a, b) => a - b)[Math.floor(diag.length / 2)] || 400;
  let pick = 0, bestErr = Infinity;
  world.items.forEach((it, i) => {
    const e = Math.abs(diag[i] - med);
    if (e < bestErr) { bestErr = e; pick = i; }
  });
  const home = world.items[pick];
  explorer.teleport(home.x, home.y - med * 1.3, Math.max(70, med * 0.5));
  explorer.yaw = 0; explorer.pitch = -0.18;
  scene.fog.near = span * 0.12;
  scene.fog.far = Math.max(24000, span * 1.6);
  // NEAR has to scale with FAR, not sit at 1 inch forever. Depth precision is
  // governed by the near:far RATIO, and `far` already grows with the world --
  // so once the corpus tripled and a packed field ran to ~200,000 inches, the
  // ratio hit 1:800,000 and the depth buffer could barely separate anything
  // past the first few feet. That is a large part of the z-fighting visible at
  // distance. Pull `far` in to just past the fog (nothing beyond it is visible
  // anyway) and tie `near` to it.
  camera.far = Math.max(20000, scene.fog.far * 1.15);
  camera.near = Math.min(40, Math.max(2, camera.far / 25000));
  camera.updateProjectionMatrix();
  explorer.speed = Math.max(260, span / 40);
  let tris = 0;
  world.group.traverse((o) => { if (o.isMesh && o.geometry.attributes.position) tris += o.geometry.attributes.position.count / 3; });
  $('modeName').textContent = world.label;
  $('counts').textContent = `${world.items.length} objects · ${Math.round(tris).toLocaleString()} triangles`
    + (world.culled ? ` · ${world.culled} ground pads culled` : '');
  $('mGallery').setAttribute('aria-pressed', which === 'gallery');
  $('mScenes').setAttribute('aria-pressed', which === 'scenes');
  $('mModels').setAttribute('aria-pressed', which === 'models');
  setWire(wireOn);              // carry the overlay state across a mode switch
  setTex(texOn);
  pinned = null; $('picked').textContent = '—';
  progress(1, 'Ready — click to look around');
  setTimeout(() => { $('splash').style.display = 'none'; }, 220);
}
$('mGallery').onclick = () => setMode('gallery');
$('mScenes').onclick = () => setMode('scenes');
$('mModels').onclick = () => setMode('models');

// ---- identify what the crosshair is on ----
const pickRay = new THREE.Raycaster();
pickRay.far = 6000;
const fwd = new THREE.Vector3();

function candidatesNear(pos, radius) {
  const out = [];
  if (!world) return out;
  for (const it of world.items) {
    if (Math.abs(it.x - pos.x) < radius && Math.abs(it.y - pos.y) < radius) {
      it.group.traverse((o) => { if (o.isMesh && !o.userData.isFeature) out.push(o); });
    }
  }
  return out;
}
function nameOf(obj) {
  for (let o = obj; o; o = o.parent) if (o.userData && o.userData.itemName) return o.userData.itemName;
  return null;
}
function lookingAt() {
  camera.getWorldDirection(fwd);
  pickRay.set(camera.position, fwd);
  const hits = pickRay.intersectObjects(candidatesNear(camera.position, 2400), false);
  for (const h of hits) { const n = nameOf(h.object); if (n) return n; }
  return null;
}
renderer.domElement.addEventListener('mousedown', () => {
  const n = lookingAt();
  if (n) { pinned = n; $('picked').textContent = n; }
});

// ---- edge overlay ----
// EdgesGeometry keeps only edges where adjacent faces differ by more than the
// threshold angle, so the diagonals inside a quad or an n-gon cap -- which are
// coplanar -- drop out and you get the shape's real outline. The lines are
// depth-tested normally, and the solid materials get a positive polygonOffset
// while the overlay is on so surfaces sit a hair behind their own edges
// instead of z-fighting them.
function setWire(on) {
  wireOn = on;
  $('mWire').setAttribute('aria-pressed', on);
  if (!world) return;
  world.group.traverse((o) => {
    if (o.isLineSegments) { o.visible = on; return; }
    if (!o.isMesh || o.userData.isFeature || o.userData.isGround) return;
    o.material.polygonOffset = on;
    o.material.polygonOffsetFactor = on ? 1 : 0;
    o.material.polygonOffsetUnits = on ? 1 : 0;
    o.material.needsUpdate = true;
    if (on && !o.userData.edges) {
      const eg = new THREE.EdgesGeometry(o.geometry, 12);
      const ls = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({ color: 0x1a1f26 }));
      ls.userData.isEdges = true;
      o.add(ls);
      o.userData.edges = ls;
    }
  });
}
$('mWire').onclick = () => setWire(!wireOn);

// ---- textures ----
// On by default: unlike the edge overlay, the bitmaps are what the surface is
// meant to look like. The geometry always carries its UVs, so this is a
// material swap -- map back on, colour back to white -- not a rebuild.
function setTex(on) {
  texOn = on;
  $('mTex').setAttribute('aria-pressed', on);
  if (!world) return;
  world.group.traverse((o) => {
    if (!o.isMesh || !o.userData.tex) return;
    const want = on ? o.userData.tex : null;
    if (o.material.map === want) return;
    o.material.map = want;
    const c = o.userData.rgb || [255, 255, 255];
    if (on) o.material.color.setRGB(1, 1, 1);
    else o.material.color.setRGB(c[0] / 255, c[1] / 255, c[2] / 255);
    o.material.needsUpdate = true;
  });
}
$('mTex').onclick = () => setTex(!texOn);
addEventListener('keydown', (e) => {
  if (e.code === 'KeyL') setWire(!wireOn);
  if (e.code === 'KeyT') setTex(!texOn);
});

// ---- loop ----
let last = performance.now(), acc = 0;
function tick(now) {
  requestAnimationFrame(tick);
  const dt = (now - last) / 1000; last = now;
  explorer.update(dt);
  if (world && (acc += dt) > 0.15) {
    acc = 0;
    const p = camera.position;
    $('pos').textContent = `x ${p.x.toFixed(0)}  y ${p.y.toFixed(0)}  z ${p.z.toFixed(0)} in`;
    const target = lookingAt();
    $('here').textContent = target || '';
    $('here').classList.toggle('on', !!target);
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(tick);
setMode('gallery').catch((e) => { $('progress').textContent = 'Failed: ' + e.message; });
</script>
</body>
</html>
