<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design-It! 3-D viewer</title>
<style>
  :root{
    --bg:#11161d; --panel:#171e27; --line:#26303d; --ink:#e6edf5; --dim:#8fa0b4;
    --accent:#5aa9e6; --accent-dim:#2d5f85;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);
       font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:grid;grid-template-columns:290px 1fr;overflow:hidden}
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  header{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:14px;letter-spacing:.02em}
  header p{margin:3px 0 0;color:var(--dim);font-size:11.5px}
  .tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tabs button{background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:5px;padding:4px 9px;font-size:11.5px;cursor:pointer}
  .tabs button[aria-selected=true]{background:var(--accent-dim);border-color:var(--accent);color:#fff}
  .search{padding:8px 10px;border-bottom:1px solid var(--line)}
  .search input{width:100%;background:#0e131a;border:1px solid var(--line);color:var(--ink);
    border-radius:5px;padding:6px 8px;font:inherit}
  #list{flex:1;overflow:auto;padding:4px 0;min-height:0}
  #list button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);
    padding:5px 14px;font:inherit;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #list button:hover{background:#1e2733}
  #list button[aria-current=true]{background:var(--accent-dim);color:#fff}
  #list .grp{padding:9px 14px 3px;color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
  main{position:relative;min-width:0}
  canvas{display:block}
  #hud{position:absolute;left:14px;top:12px;pointer-events:none;text-shadow:0 1px 3px #000}
  #hud h2{margin:0;font-size:15px}
  #hud p{margin:2px 0 0;color:var(--dim);font-size:11.5px}
  #opts{position:absolute;right:14px;top:12px;background:rgba(23,30,39,.92);border:1px solid var(--line);
    border-radius:7px;padding:9px 11px;display:grid;gap:5px}
  #opts label{display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--dim);cursor:pointer}
  #opts input{accent-color:var(--accent)}
  #err{position:absolute;left:14px;bottom:12px;color:#ff9f9f;font-size:12px;max-width:60ch}
</style>
</head>
<body>
<aside>
  <header>
    <h1>Design-It! 3-D viewer</h1>
    <p>1 unit = 1 inch &middot; Z up</p>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="search"><input id="q" placeholder="Filter&hellip;" autocomplete="off"></div>
  <div id="list"></div>
</aside>
<main>
  <div id="hud"><h2 id="title">Loading&hellip;</h2><p id="stats"></p></div>
  <div id="opts">
    <label><input type="checkbox" id="optSlic" checked> SLIC cuts</label>
    <label><input type="checkbox" id="optSurf" checked> Surface decals</label>
    <label><input type="checkbox" id="optFlat" checked> Flat shading</label>
    <label><input type="checkbox" id="optTex" checked> Textures</label>
    <label><input type="checkbox" id="optWire"> Wireframe</label>
    <label><input type="checkbox" id="optSpin"> Auto-rotate</label>
  </div>
  <div id="err"></div>
</main>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { loadScene, listClips, loadClip, options } from './src/three-loader.js';

THREE.Object3D.DEFAULT_UP.set(0, 0, 1);        // the format is Z-up

const DATA = '../data/';
const $ = (id) => document.getElementById(id);
const els = { list: $('list'), tabs: $('tabs'), q: $('q'), title: $('title'), stats: $('stats'), err: $('err') };

// ---- three.js scaffolding ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
$('title').parentElement.parentElement.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11161d);
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 200000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
// The APPLICATION's OWN LIGHT RIG, read straight out of its VRML exporter --
// all 53 exports in the corpus carry the same four lights, byte for byte:
//
//   colour 0.4  direction 0 0 0          <- zero direction: this is the ambient
//   colour 0.5  direction   34 -247 -57
//   colour 0.4  direction -209 -104 105
//   colour 0.5  direction    5  119 -226
//
// All three real directions have length ~256, so they are stored as normalised
// vectors. VRML `direction` is the direction light TRAVELS and three.js wants
// where it comes FROM, so each is negated; app -> our axes is (x, -z, y), the
// same mapping wrlfit uses. That works out as two lamps above (one steep, one
// at 45 degrees) and a fill from below -- a real three-point rig.
//
// This replaces a single axis lit as |n . L|, which was wrong in a way that
// only showed on a complicated model: with one axis the poorly-lit normals are
// an entire GREAT CIRCLE, so every face perpendicular to it went to ambient at
// once. On the `Farmer` that was most of his front, and it read as being lit
// from below. Three spread lamps leave only a small cone dark.
//
// Intensities are scaled by 1/0.7978 so the brightest reachable face lands on
// full albedo instead of 80% of it, and by PI because r155+ three.js lights in
// physical units. The 0.25 ambientColor/diffuseColor ratio from the materials
// is folded into the ambient term (0.4 x 0.25 = 0.1).
THREE.ColorManagement.enabled = false;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
scene.add(new THREE.AmbientLight(0xffffff, 0.1253 * Math.PI));
for (const [i, p] of [[0.6267, [-0.1329, -0.2229, 0.9657]],
                      [0.5014, [ 0.8165,  0.4102, 0.4063]],
                      [0.6267, [-0.0196, -0.8847, -0.4658]]]) {
  const L = new THREE.DirectionalLight(0xffffff, i * Math.PI);
  L.position.set(p[0], p[1], p[2]);
  scene.add(L);
}
const grid = new THREE.GridHelper(4800, 50, 0x2a3644, 0x1c242e);
grid.rotation.x = Math.PI / 2;
scene.add(grid);

let current = null;
function resize() {
  const m = renderer.domElement.parentElement;
  const w = m.clientWidth, h = m.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

function frame(box) {
  const size = box.getSize(new THREE.Vector3());
  const c = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.length() / 2, 1);
  controls.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(r * 1.5, -r * 1.9, r * 1.15));
  camera.near = Math.max(r / 500, 0.1);
  camera.far = r * 60;
  camera.updateProjectionMatrix();
  grid.position.set(c.x, c.y, box.min.z);
}

function show(built, label, extra = '') {
  if (current) { scene.remove(current.group); disposeGroup(current.group); }
  current = built;
  scene.add(built.group);
  frame(built.box);
  applyToggles();
  const s = built.box.getSize(new THREE.Vector3());
  els.title.textContent = label;
  els.stats.textContent =
    `${built.meshCount} parts · ${built.triangles.toLocaleString()} triangles · ` +
    `${s.x.toFixed(0)}×${s.y.toFixed(0)}×${s.z.toFixed(0)} in${extra}`;
}
function disposeGroup(g) { g.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); }

function applyToggles() {
  if (!current) return;
  const wire = $('optWire').checked, surf = $('optSurf').checked;
  const tex = $('optTex').checked;
  current.group.traverse((o) => {
    if (!o.isMesh) return;
    o.material.wireframe = wire;
    if (o.userData.isFeature) o.visible = surf;
    // A textured material is painted white so the bitmap shows through
    // unmodified; with textures off it goes back to the face's own colour.
    if (o.userData.tex) {
      const want = tex ? o.userData.tex : null;
      if (o.material.map !== want) {
        o.material.map = want;
        const c = o.userData.rgb;
        if (tex) o.material.color.setRGB(1, 1, 1);
        else o.material.color.setRGB(c[0] / 255, c[1] / 255, c[2] / 255);
        o.material.needsUpdate = true;
      }
    }
  });
}

// ---- catalogue ----
let manifest = null, tab = 'scenes', selected = null;
const TABS = [['scenes', 'Scenes'], ['models', 'Models'], ['galleries3d', '3D galleries'],
              ['exports', 'Exports'], ['misc', 'Misc']];

async function boot() {
  resize();
  manifest = await (await fetch(DATA + 'manifest.json')).json();
  for (const [k, lbl] of TABS) {
    const b = document.createElement('button');
    b.textContent = lbl;
    b.onclick = () => { tab = k; render(); };
    b.dataset.k = k;
    els.tabs.appendChild(b);
  }
  els.q.oninput = render;
  render();
  const first = manifest.files.find((f) => f.bucket === 'models' && f.path.includes('BULLDOG'))
             || manifest.files.find((f) => f.bucket === 'models');
  if (first) open(first);
  tick();
}

function render() {
  for (const b of els.tabs.children) b.setAttribute('aria-selected', b.dataset.k === tab);
  const q = els.q.value.trim().toLowerCase();
  els.list.innerHTML = '';
  const files = manifest.files.filter((f) => f.bucket.split('/')[0] === tab);
  if (tab === 'galleries3d') {
    for (const f of files) {
      const clips = (f.clips || []).filter((c) => !q || c.name.toLowerCase().includes(q));
      if (!clips.length) continue;
      const h = document.createElement('div');
      h.className = 'grp';
      h.textContent = f.path.split('/').pop().replace(/\.WLB$/i, '');
      els.list.appendChild(h);
      for (const c of clips) addRow(`${c.name}`, () => openClip(f, c.name), `${f.path}::${c.name}`);
    }
  } else {
    let group = null;
    for (const f of files.filter((f) => !q || f.path.toLowerCase().includes(q))) {
      const g = f.bucket.includes('/') ? f.bucket.split('/').slice(1).join('/') : null;
      if (g && g !== group) {
        group = g;
        const h = document.createElement('div'); h.className = 'grp'; h.textContent = g;
        els.list.appendChild(h);
      }
      addRow(f.path.split('/').pop(), () => open(f), f.path);
    }
  }
}
function addRow(label, fn, id) {
  const b = document.createElement('button');
  b.textContent = label;
  b.setAttribute('aria-current', id === selected);
  b.onclick = () => { selected = id; fn(); for (const x of els.list.querySelectorAll('button')) x.setAttribute('aria-current', false); b.setAttribute('aria-current', true); };
  els.list.appendChild(b);
  return b;
}

const bufCache = new Map();
async function fetchBuf(p) {
  if (!bufCache.has(p)) bufCache.set(p, fetch(DATA + p.split('/').map(encodeURIComponent).join('/')).then((r) => r.arrayBuffer()));
  return bufCache.get(p);
}

async function open(f) {
  els.err.textContent = '';
  try {
    const buf = await fetchBuf(f.path);
    show(loadScene(buf, { flatShading: $('optFlat').checked }), f.path.split('/').pop(),
         f.apps ? ` · ${f.apps.join(' + ')}` : '');
  } catch (e) { els.err.textContent = `${f.path}: ${e.message}`; }
}
async function openClip(f, name) {
  els.err.textContent = '';
  try {
    const buf = await fetchBuf(f.path);
    const clip = listClips(buf).find((c) => c.name === name);
    if (!clip) throw new Error('clip not found');
    show(loadClip(clip, { flatShading: $('optFlat').checked }), name,
         ` · ${f.path.split('/').pop()}`);
  } catch (e) { els.err.textContent = `${name}: ${e.message}`; }
}

for (const id of ['optWire', 'optSurf', 'optTex']) $(id).onchange = applyToggles;
for (const id of ['optSlic', 'optFlat']) $(id).onchange = () => {
  options.applySlic = $('optSlic').checked;
  if (selected) {
    const [p, nm] = selected.split('::');
    const f = manifest.files.find((x) => x.path === p);
    if (f) nm ? openClip(f, nm) : open(f);
  }
};
$('optSpin').onchange = () => { controls.autoRotate = $('optSpin').checked; controls.autoRotateSpeed = 1.2; };

function tick() {
  requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
}
boot().catch((e) => { els.err.textContent = 'Boot failed: ' + e.message; });
</script>
</body>
</html>
